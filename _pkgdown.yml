url: https://sagesteppe.github.io/lsed/

template:
  bootstrap: 5
  math-rendering: mathjax

reference:
- title: Prevalence weighting
  desc: Re-price an evaluation sample to a target landscape prevalence.
  contents:
  - reweight

- title: Reported diagnostics
  desc: >
    The two per-sample summary scores a model reports. ROC-AUC is
    prevalence-invariant but inflated by easy absences; PR-AUC is the recommended
    anchor for curve reconstruction.
  contents:
  - roc_auc
  - pr_auc

- title: Average precision & PR curves
  desc: >
    Precision-recall at a target prevalence, by the exact point-level route and
    the equal-variance binormal (summary-metric) route.
  contents:
  - ap_pointwise
  - ap_binormal
  - ap_scalar_to_prev
  - pr_curve_exact
  - pr_curve_binormal

- title: Net benefit (decision curves)
  desc: Decision-curve net benefit and its reference strategies.
  contents:
  - nb_exact
  - nb_exact_ci
  - nb_binormal
  - nb_binormal_band
  - nb_treat_all

- title: Calibration
  desc: Assess and shift the calibration of held-out predictions.
  contents:
  - cox_calibration
  - recalibrate_to_prevalence
  - clamp

- title: Survey-unit delineation
  desc: >
    Turn a predicted suitability surface into mapped survey units end to end
    (watershed patches, subdivided and attributed). The low-level stages are
    internal; this is the single entry point.
  contents:
  - survey_units

- title: Patch ranking (RankIndex)
  desc: >
    Prioritise candidate patches by combining rescaled terms. The network engine
    routes travel on roads/trails to score accessibility (A) and, on the same
    graph, complementarity (C) — whether a day's work can be assembled nearby.
  contents:
  - rank_index
  - network
  - accessibility
  - complementarity
  - contract_network
  - osm_speeds

- title: RankIndex — distance terms (Dg, Dr, A)
  desc: >
    Isotropic, terra-native distance surfaces: straight-line distance from known
    populations (Dg), least-cost resistance distance (Dr) over a friction surface,
    and Tobler walking cost for accessibility.
  contents:
  - cost
  - geo_distance
  - cost_distance
  - build_resistance
  - tobler_friction
  - cluster_region_extents

- title: RankIndex — survey intensity (S)
  desc: >
    The survey-effort "bias surface" as a gridless Gaussian field of target-group
    occurrences, with inverse-frequency species weighting corrected for domain
    clipping; inverted it gives survey sparsity, where undocumented populations may hide.
  contents:
  - survey
  - survey_surface
  - survey_weights
  - guess_record_type

- title: RankIndex — pipeline modules
  desc: >
    The two halves of a run: acquire every external input once (download), then
    compute all terms and combine them (calculate). Split so the slow, API-bound
    acquisition is reused while weights are tuned.
  contents:
  - rank_download
  - rank_calculate

- title: Data acquisition (GBIF & OSM)
  desc: >
    Fetch the external inputs — target-group occurrences from GBIF's bulk download
    (for S) and the OSM road/trail network scoped to patch clusters (for A/C). Both
    cache to disk; be a good API citizen.
  contents:
  - gbif_records
  - gbif_request
  - gbif_retrieve
  - osm_network_for
  - osm_access
  - cluster_patches
