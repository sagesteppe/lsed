url: https://sagesteppe.github.io/lsed/

template:
  bootstrap: 5

reference:
- title: Prevalence weighting
  desc: Re-price an evaluation sample to a target landscape prevalence.
  contents:
  - reweight

- title: Discrimination
  desc: Prevalence-invariant ranking performance.
  contents:
  - roc_auc

- title: Average precision & PR curves
  desc: >
    Precision-recall at a target prevalence, by the exact point-level route and
    the equal-variance binormal (summary-metric) route.
  contents:
  - ap_pointwise
  - ap_binormal
  - ap_scalar_to_prev
  - pr_curve_exact
  - pr_curve_binormal

- title: Net benefit (decision curves)
  desc: Decision-curve net benefit and its reference strategies.
  contents:
  - nb_exact
  - nb_binormal
  - nb_treat_all

- title: Calibration
  desc: Assess and shift the calibration of held-out predictions.
  contents:
  - cox_calibration
  - recalibrate_to_prevalence
  - clamp
