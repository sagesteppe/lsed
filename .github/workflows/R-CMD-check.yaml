# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # ── WhiteboxTools binary (patch-delineation pipeline) ─────────────────
      # whitebox::install_whitebox() fetches a ~100 MB executable, separate from
      # the R package and not covered by the R-library cache. Cache it so it
      # downloads once; a hit restores it to whitebox's user data dir where
      # wbt_exe_path() finds it, so the patch-pipeline tests run instead of
      # skipping. The data dir differs per OS, so compute it with R.
      - name: WhiteboxTools data dir
        id: wbt
        run: cat(paste0("dir=", tools::R_user_dir("whitebox", "data"), "\n"), file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
        shell: Rscript {0}

      - name: Cache WhiteboxTools
        id: cache-whitebox
        uses: actions/cache@v4
        with:
          path: ${{ steps.wbt.outputs.dir }}
          key: whitebox-${{ runner.os }}-v1

      - name: Install WhiteboxTools
        if: steps.cache-whitebox.outputs.cache-hit != 'true'
        run: whitebox::install_whitebox()
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
