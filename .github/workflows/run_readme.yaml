name: Update README
on:
  push:
    branches:
      - main
    paths:
      - 'README.Rmd'          # only when the source changes
  workflow_dispatch:           # allow a manual re-render

permissions:
  contents: write              # needed to push the rendered README.md back

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # README.Rmd only evaluates the badge chunk, so render needs just these
      # (not the whole package dependency tree).
      - name: Install render dependencies
        run: install.packages(c("rmarkdown", "badger"))
        shell: Rscript {0}

      - name: Render README.Rmd -> README.md
        run: ./update-readme.sh

      - name: Commit rendered README.md
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "README.md already up to date."
          else
            git commit -m "docs: re-render README.md from README.Rmd [skip ci]"
            git push
          fi
